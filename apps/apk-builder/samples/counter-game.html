<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AIYA 计数小游戏</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #c7fff0 0, #eefbf8 38%, #f8f7f2 100%);
      color: #14342f;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .game {
      width: min(92vw, 420px);
      padding: 28px;
      border: 1px solid rgba(20, 120, 95, 0.16);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 80px rgba(21, 91, 75, 0.16);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 8vw, 44px);
    }

    p {
      margin: 0 0 22px;
      color: #53716c;
      line-height: 1.6;
    }

    .score {
      display: inline-grid;
      place-items: center;
      width: 132px;
      height: 132px;
      margin: 10px auto 24px;
      border-radius: 50%;
      background: linear-gradient(145deg, #00c896, #30e7b7);
      color: white;
      font-size: 58px;
      font-weight: 900;
      box-shadow: 0 18px 36px rgba(0, 180, 132, 0.32);
      user-select: none;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 18px 22px;
      background: #102c28;
      color: white;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(16, 44, 40, 0.2);
    }

    button:active {
      transform: translateY(2px) scale(0.99);
    }
  </style>
</head>
<body>
  <main>
    <section class="game" aria-label="AIYA 计数小游戏">
      <h1>点点能量球</h1>
      <p>每点一次按钮，能量球就会长大一点。试试看你能点到多少分！</p>
      <div class="score" id="score">0</div>
      <button id="tap" type="button">加 1 分</button>
    </section>
  </main>
  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    const tapEl = document.getElementById('tap');

    tapEl.addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = String(score);
      scoreEl.animate(
        [
          { transform: 'scale(1)' },
          { transform: 'scale(1.12)' },
          { transform: 'scale(1)' }
        ],
        { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' }
      );
    });
  </script>
</body>
</html>
