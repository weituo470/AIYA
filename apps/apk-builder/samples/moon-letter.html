<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b16">
  <title>月球来信</title>
  <style>
    :root{color-scheme:dark;--ink:#090b16;--blue:#8bbcff;--amber:#ffc65c;--paper:#edf3ff;--muted:#8e9ab5}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    button,input{font:inherit}button{border:0;color:inherit}
    .app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));background:radial-gradient(circle at 52% 32%,#1b2342 0,#0c1022 35%,#070811 74%);position:relative;isolation:isolate}.app:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.25;background-image:radial-gradient(circle,#d5e4ff 0 1px,transparent 1.5px);background-size:43px 43px;background-position:11px 9px}.app:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 50%,rgba(75,115,172,.035) 50%);background-size:100% 4px;pointer-events:none}
    header{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:10px;letter-spacing:.22em;color:var(--blue);font-weight:900}h1{margin:4px 0 0;font-size:30px;line-height:1;letter-spacing:-.07em}.chapter{text-align:right;font-size:10px;letter-spacing:.12em;color:var(--muted)}.chapter strong{display:block;margin-top:2px;color:var(--paper);font-size:20px}
    .space{min-height:0;position:relative;display:grid;place-items:center}.moon{position:absolute;top:5%;width:min(57vw,230px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 31%,#fff 0 2%,transparent 3%),radial-gradient(circle at 64% 26%,rgba(78,94,135,.23) 0 7%,transparent 8%),radial-gradient(circle at 34% 63%,rgba(65,79,113,.24) 0 12%,transparent 13%),radial-gradient(circle at 70% 71%,rgba(75,87,118,.2) 0 8%,transparent 9%),linear-gradient(145deg,#f5f8ff,#aab7d2 68%,#5b6783);box-shadow:-22px 16px 52px rgba(111,154,223,.16),inset -28px -18px 34px rgba(37,42,70,.35);transition:filter .25s,transform .6s}.moon.locked{filter:drop-shadow(0 0 28px rgba(139,188,255,.7));transform:scale(1.04)}.orbit{position:absolute;top:1%;width:min(76vw,300px);aspect-ratio:1;border:1px solid rgba(139,188,255,.16);border-radius:50%;transform:rotate(-18deg)}.orbit:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--amber);left:8%;top:35%;box-shadow:0 0 16px var(--amber);animation:blink 1.8s infinite}@keyframes blink{50%{opacity:.25}}
    .transcript{position:absolute;left:0;right:0;bottom:7%;min-height:116px;padding:16px 17px;border-left:2px solid var(--blue);background:linear-gradient(90deg,rgba(21,29,55,.88),rgba(12,16,31,.24));backdrop-filter:blur(5px)}.signalLabel{font-size:9px;letter-spacing:.18em;color:var(--blue);font-weight:900}.message{margin:9px 0 0;font-size:17px;line-height:1.62;letter-spacing:.01em}.message.dim{color:#77829d}.cursor:after{content:"";display:inline-block;width:7px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--blue);animation:cursor .8s steps(1) infinite}@keyframes cursor{50%{opacity:0}}
    .console{border-top:1px solid rgba(145,174,222,.16);padding-top:12px}.freqRow{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}.freqLabel{font-size:9px;letter-spacing:.16em;color:var(--muted)}.freq{font:900 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.06em}.freq small{font-size:11px;color:var(--muted);letter-spacing:0}.meter{height:5px;border-radius:9px;background:rgba(219,231,255,.1);overflow:hidden;margin-bottom:10px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5474a8,var(--blue),var(--amber));box-shadow:0 0 18px rgba(139,188,255,.7);transition:width .12s}.dial{width:100%;accent-color:var(--blue);margin:0 0 11px}.lock{width:100%;min-height:50px;border-radius:15px;background:var(--blue);color:#0a1327;font-weight:950;box-shadow:0 12px 28px rgba(91,142,219,.16)}.lock:disabled{background:#222a40;color:#68738f;box-shadow:none}.hint{margin:8px 0 0;text-align:center;min-height:15px;font-size:10px;color:var(--muted)}
    .choices{position:fixed;z-index:8;inset:0;display:none;align-items:flex-end;padding:24px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,5,11,.12),rgba(4,5,11,.97) 60%);backdrop-filter:blur(8px)}.choices.show{display:flex}.choiceInner{width:100%}.choiceInner .signalLabel{margin-bottom:8px}.choiceInner h2{margin:0 0 18px;font-size:31px;line-height:1.15;letter-spacing:-.05em}.choice{width:100%;min-height:62px;margin-top:9px;padding:12px 15px;border:1px solid rgba(147,182,235,.2);border-radius:16px;background:rgba(25,34,62,.84);text-align:left;font-weight:800}.choice small{display:block;margin-top:4px;color:#8d9bb8;font-size:10px;font-weight:500}.choice:active{transform:scale(.985);border-color:var(--blue)}
    .cover,.ending{position:fixed;z-index:12;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:34px 24px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 24%,rgba(168,190,228,.32) 0 15%,transparent 16%),radial-gradient(circle at 50% 24%,rgba(188,205,234,.18) 0 23%,transparent 24%),linear-gradient(180deg,#11182f,#070812 70%);transition:.4s}.cover.hide{opacity:0;visibility:hidden;pointer-events:none}.cover:before{content:"";position:absolute;top:9%;left:50%;width:172px;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:linear-gradient(140deg,#eef3ff,#7784a4);box-shadow:inset -24px -18px 30px rgba(24,28,52,.45),0 0 60px rgba(127,172,238,.16)}.kicker{position:relative;font-size:10px;letter-spacing:.22em;color:var(--blue);font-weight:900}.cover h2,.ending h2{position:relative;margin:8px 0 12px;font-size:55px;line-height:.91;letter-spacing:-.08em}.cover p,.ending p{position:relative;margin:0 0 22px;color:#aeb9d0;font-size:14px;line-height:1.7}.primary{position:relative;width:100%;min-height:56px;border-radius:17px;background:var(--blue);color:#09142a;font-weight:950;font-size:16px}.ending{display:none;justify-content:center;background:rgba(7,8,18,.94);backdrop-filter:blur(14px)}.ending.show{display:flex}.ending h2{font-size:46px}.stamp{margin:0 0 18px;width:66px;height:66px;display:grid;place-items:center;border:1px solid rgba(255,198,92,.5);border-radius:50%;color:var(--amber);font-size:25px;transform:rotate(-8deg)}
  </style>
</head>
<body>
  <main class="app" aria-label="月球来信分支叙事">
    <header><div><div class="brand">AIYA INTERACTIVE STORY · 03</div><h1>月球来信</h1></div><div class="chapter">信号章节<strong id="chapter">1 / 3</strong></div></header>
    <section class="space"><div class="orbit"></div><div class="moon" id="moon"></div><div class="transcript"><div class="signalLabel" id="signalLabel">未识别信号</div><p class="message dim" id="message">转动下方频率旋钮，寻找藏在噪声里的来信。</p></div></section>
    <section class="console"><div class="freqRow"><span class="freqLabel">RECEIVER FREQUENCY</span><strong class="freq"><span id="frequency">99.0</span> <small>MHz</small></strong></div><div class="meter"><i id="meter"></i></div><input class="dial" id="dial" type="range" min="80" max="120" step="0.1" value="99"><button class="lock" id="lock" disabled>信号太弱</button><p class="hint" id="hint">越接近信号，声音越清晰、能量条越亮</p></section>
  </main>
  <section class="cover" id="cover"><div class="kicker">一封来自 384,400 公里外的信</div><h2>请替地球<br>回一封信</h2><p>调谐三段月球信号。你选择的每一句回答，都会改变这封信最后抵达的方向。</p><button class="primary" id="start">打开接收器</button></section>
  <section class="choices" id="choices"><div class="choiceInner"><div class="signalLabel">等待你的回答</div><h2 id="question"></h2><button class="choice" id="choiceA"></button><button class="choice" id="choiceB"></button></div></section>
  <section class="ending" id="ending"><div class="stamp">◒</div><div class="kicker">TRANSMISSION COMPLETE</div><h2 id="endingTitle">信号已送达</h2><p id="endingText"></p><button class="primary" id="again">重新收听</button></section>
  <script>
    (()=>{
      const chapters=[
        {target:91.7,label:'LUNA-07 · 低功率信标',message:'“如果你听见这段信号，请先告诉我：地球现在是什么颜色？”',question:'你准备怎样回答第一封信？',a:['还是蓝色，但我们正在学会珍惜它','信任 +2 · 诚实而具体',2],b:['先报告你的坐标和身份','信任 +0 · 安全但疏离',0]},
        {target:106.4,label:'LUNA-07 · 月背中继',message:'“返航舱只够带回一个人，地下冰样本却可能改变未来。”',question:'生命与发现之间，你会怎么建议？',a:['先让人回家，发现可以留下坐标','信任 +2 · 把人放在成果之前',2],b:['带回样本，它可能帮助更多人','信任 +1 · 选择长期价值',1]},
        {target:117.2,label:'LUNA-07 · 最后窗口',message:'“我真正想问的不是带什么回来，而是谁有权替另一个人决定。”',question:'最后一封回信，只能发送一句话。',a:['把信息说清楚，让他自己选择','信任 +2 · 尊重选择权',2],b:['按地球最优方案执行','信任 -1 · 效率高于个体',-1]}
      ];
      const cover=document.getElementById('cover'),ending=document.getElementById('ending'),choices=document.getElementById('choices'),dial=document.getElementById('dial'),meter=document.getElementById('meter'),lock=document.getElementById('lock'),frequency=document.getElementById('frequency'),moon=document.getElementById('moon');
      const message=document.getElementById('message'),signalLabel=document.getElementById('signalLabel'),hint=document.getElementById('hint');
      let index=0,trust=0,locked=false,audio=null,osc=null,gain=null,noise=null,noiseGain=null,typeTimer=0;
      function setupAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();osc=audio.createOscillator();gain=audio.createGain();osc.type='sine';osc.frequency.value=180;gain.gain.value=.0001;osc.connect(gain);gain.connect(audio.destination);osc.start();const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;noiseGain=audio.createGain();noiseGain.gain.value=.012;noise.connect(noiseGain);noiseGain.connect(audio.destination);noise.start()}
      function strength(){const distance=Math.abs(Number(dial.value)-chapters[index].target);return Math.max(0,100-distance*14)}
      function updateDial(){if(locked)return;const value=Number(dial.value),power=strength();frequency.textContent=value.toFixed(1);meter.style.width=power+'%';lock.disabled=power<86;lock.textContent=power>=86?'锁定这段信号':power>58?'再靠近一点':'信号太弱';hint.textContent=power>86?'信号清晰，可以锁定':power>58?'听见断续的人声了':'越接近信号，声音越清晰、能量条越亮';if(audio){gain.gain.setTargetAtTime(.002+power/6500,audio.currentTime,.04);osc.frequency.setTargetAtTime(145+power*2.2,audio.currentTime,.05);noiseGain.gain.setTargetAtTime(.018-power/6500,audio.currentTime,.05)}}
      function typeText(text,done){clearInterval(typeTimer);message.classList.remove('dim');message.classList.add('cursor');message.textContent='';let i=0;typeTimer=setInterval(()=>{message.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);message.classList.remove('cursor');done?.()}},34)}
      function lockSignal(){if(lock.disabled||locked)return;locked=true;moon.classList.add('locked');meter.style.width='100%';lock.textContent='信号已锁定';navigator.vibrate?.([24,35,45]);if(audio){gain.gain.setTargetAtTime(.06,audio.currentTime,.02);noiseGain.gain.setTargetAtTime(.001,audio.currentTime,.04)}signalLabel.textContent=chapters[index].label;typeText(chapters[index].message,()=>setTimeout(showChoices,500))}
      function showChoices(){const ch=chapters[index];document.getElementById('question').textContent=ch.question;const a=document.getElementById('choiceA'),b=document.getElementById('choiceB');a.innerHTML=`${ch.a[0]}<small>${ch.a[1]}</small>`;b.innerHTML=`${ch.b[0]}<small>${ch.b[1]}</small>`;choices.classList.add('show')}
      function choose(which){const ch=chapters[index],pick=which==='a'?ch.a:ch.b;trust+=pick[2];choices.classList.remove('show');navigator.vibrate?.(18);index++;if(index>=chapters.length){setTimeout(finish,420);return}locked=false;moon.classList.remove('locked');document.getElementById('chapter').textContent=`${index+1} / 3`;signalLabel.textContent='下一段信号正在漂移';message.textContent='频率已经改变。重新转动旋钮，寻找下一段来信。';message.classList.add('dim');dial.value=index===1?'101':'112';frequency.textContent=Number(dial.value).toFixed(1);meter.style.width='0';lock.disabled=true;lock.textContent='信号太弱';if(audio){gain.gain.setTargetAtTime(.0001,audio.currentTime,.05);noiseGain.gain.setTargetAtTime(.014,audio.currentTime,.05)}updateDial()}
      function finish(){if(audio){gain.gain.setTargetAtTime(.0001,audio.currentTime,.08);noiseGain.gain.setTargetAtTime(.0001,audio.currentTime,.08)}const title=trust>=5?'把选择还给人':trust>=2?'一封理性的信':'沉默的最优解';const text=trust>=5?'你的回信没有替任何人做决定，而是提供事实、表达关心，并把选择权交还给当事人。月球信标回复：谢谢你把我当作一个人。':trust>=2?'你在生命、发现与效率之间做了权衡。月球信标已收到，但它仍在等待一个更有人情味的答案。':'每一步都很高效，却没有人真正被听见。信号最后只返回了一句：最优解属于谁？';document.getElementById('endingTitle').textContent=title;document.getElementById('endingText').textContent=text;ending.classList.add('show');navigator.vibrate?.([30,45,60])}
      function start(){setupAudio();audio?.resume();cover.classList.add('hide');ending.classList.remove('show');choices.classList.remove('show');index=0;trust=0;locked=false;dial.value='99';document.getElementById('chapter').textContent='1 / 3';signalLabel.textContent='未识别信号';message.textContent='转动下方频率旋钮，寻找藏在噪声里的来信。';message.classList.add('dim');moon.classList.remove('locked');updateDial()}
      dial.addEventListener('input',()=>{updateDial();navigator.vibrate?.(3)});lock.addEventListener('click',lockSignal);document.getElementById('choiceA').addEventListener('click',()=>choose('a'));document.getElementById('choiceB').addEventListener('click',()=>choose('b'));document.getElementById('start').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);addEventListener('contextmenu',e=>e.preventDefault());addEventListener('pagehide',()=>{clearInterval(typeTimer);try{osc?.stop();noise?.stop();audio?.close()}catch(_){}});updateDial();
    })();
  </script>
</body>
</html>
