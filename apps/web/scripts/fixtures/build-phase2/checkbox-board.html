<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验证器复选框对照</title><style>html{font-size:100%}body{font:1.125rem/1.8 system-ui;margin:24px;color:#17372e;background:#f3f9f6}main{max-width:760px;margin:auto}button,input{font-size:1rem;min-height:44px;padding:8px}button{cursor:pointer;margin:6px}input[type=text]{max-width:90%;width:320px}input[type=checkbox]{width:24px;min-height:24px}label{display:flex;align-items:center;gap:12px;min-height:44px}section{margin-top:24px}[hidden]{display:none}h1{font-size:1.75rem;line-height:1.4}li{margin:16px 0}</style></head><body><main><h1>验证器复选框对照</h1><p>这个独立测试页面使用标准复选框完成任务，并同步统计。用来检查“无法定位完成按钮”是否等于功能坏了。</p><nav><button id="taskTab">任务</button><button id="statsTab">统计</button></nav><section id="tasks"><input id="taskInput" data-aiya="task-input" type="text" aria-label="任务名称"><button id="add">添加</button><ul id="taskList" data-aiya="task-list"></ul></section><section id="stats" hidden><p>总数：<output data-aiya="stat-total">0</output></p><p>完成数：<output data-aiya="stat-done">0</output></p></section><script>(()=>{let tasks=[];const field=document.querySelector('#taskInput'),list=document.querySelector('#taskList');function render(){list.replaceChildren();for(const t of tasks){const row=document.createElement('li'),label=document.createElement('label'),c=document.createElement('input'),txt=document.createElement('span'),del=document.createElement('button');c.type='checkbox';c.checked=t.done;c.setAttribute('aria-label','完成'+t.text);c.onchange=()=>{t.done=c.checked;render()};txt.textContent=t.text;label.append(c,txt);del.textContent='删除';del.onclick=()=>{tasks=tasks.filter(v=>v!==t);render()};row.append(label,del);list.append(row)}document.querySelector('[data-aiya="stat-total"]').textContent=tasks.length;document.querySelector('[data-aiya="stat-done"]').textContent=tasks.filter(t=>t.done).length}document.querySelector('#add').onclick=()=>{if(field.value.trim()){tasks.push({text:field.value.trim(),done:false});field.value='';render()}};document.querySelector('#taskTab').onclick=()=>{document.querySelector('#tasks').hidden=false;document.querySelector('#stats').hidden=true};document.querySelector('#statsTab').onclick=()=>{document.querySelector('#tasks').hidden=true;document.querySelector('#stats').hidden=false};render()})()</script></main></body></html>
