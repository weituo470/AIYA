plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'cc.shenliu.aiya.v3'
    compileSdk 36

    defaultConfig {
        applicationId 'cc.shenliu.aiya.v3'
        minSdk 26
        targetSdk 36
        versionCode 76
        versionName '0.6.70'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Catalog tests read this asset directly; changes must invalidate Gradle's test cache.
tasks.withType(Test).configureEach {
    inputs.file('src/main/assets/golden-key.json')
    inputs.property('goldenKeyLive', System.getenv('AIYA_GOLDEN_KEY_LIVE') ?: '0')
    inputs.property('goldenKeyIds', System.getenv('AIYA_GOLDEN_KEY_IDS') ?: '')
    inputs.property('taskRecoveryLive', System.getenv('AIYA_RECOVERY_LIVE') ?: '0')
    inputs.property('taskRecoveryClientId', System.getenv('AIYA_RECOVERY_CLIENT_ID') ?: '')
    if (System.getenv('AIYA_GOLDEN_KEY_LIVE') == '1' || System.getenv('AIYA_RECOVERY_LIVE') == '1') {
        outputs.upToDateWhen { false }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

    testImplementation 'junit:junit:4.13.2'
    // Optional verified offline cache for this host's blocked Maven connection.
    // Test classpath only; never packaged into the APK.
    if (project.hasProperty('aiyaJsonTestJar')) {
        testImplementation files(project.property('aiyaJsonTestJar'))
    } else {
        testImplementation 'org.json:json:20240303'
    }

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
